name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type-check (mypy)
        run: mypy --strict src/aerial_lidar_spatial_eval

      - name: Unit tests
        run: pytest tests/ -q --ignore=tests/integration --ignore=tests/test_benchmark.py

      - name: Integration tests
        run: pytest tests/integration/ -q

      - name: Docs build
        run: mkdocs build --strict

      - name: Dependency audit
        run: pip-audit --desc

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  benchmark:
    name: Benchmark (informational)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install -e ".[dev]" --system
      - name: Run benchmarks
        run: pytest tests/test_benchmark.py --benchmark-only -q --benchmark-json=benchmark.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json
