site_name: aerial-lidar-spatial-eval
site_description: Distance-weighted spatially-aware evaluation metrics for aerial LiDAR semantic segmentation
site_url: https://daudee215.github.io/aerial-lidar-spatial-eval/
repo_url: https://github.com/daudee215/aerial-lidar-spatial-eval
repo_name: daudee215/aerial-lidar-spatial-eval

theme:
  name: material
  palette:
    - scheme: default
      primary: blue grey
      accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: true

nav:
  - Home: index.md
  - API Reference: api.md
  - ADR:
      - "ADR-0001: Spatial Indexing Backend": adr/0001-spatial-indexing-backend.md

strict: true
